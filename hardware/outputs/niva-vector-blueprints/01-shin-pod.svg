etica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">ASSEMBLY</text><rect width="159" height="53" x="243" y="168" fill="#FFF" stroke="#FFF" stroke-width="0" rx="0"/><text x="245" y="173" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">A Front shell + one-piece button membrane</text><text x="245" y="179.3" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">B Replaceable perimeter gasket</text><text x="245" y="185.6" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">C PCB fixed to rear shell; IMU cannot float</text><text x="245" y="191.9" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">D Rear shell with cartridge rails</text><text x="245" y="198.2" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">E Sealed, protected battery cartridge</text><text x="245" y="204.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">F Side-keyed cradle and 35-wide ladder strap</text><text x="245" y="210.8" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">G Replaceable smooth silicone contact pad</text><rect width="166" height="43" x="240" y="225" fill="none" stroke="#BDCBD2" stroke-width=".25" rx="2"/><text x="245" y="233" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">PACKAGING DECISION</text><text x="245" y="240" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">60 x 42 x 20 P is a revised custom-PCB target, not a proven fit. The</text><text x="245" y="244.7" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">brief&apos;s 48 x 34 x 13 envelope is not carried forward. Breakout-board v0</text><text x="245" y="249.4" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">needs a separate larger enclosure after parts are measured.</text><text x="19" y="265" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="3.2" font-weight="normal" text-anchor="start">35 P strap width / soft radiused slots / flush rear service screws / no external charging port</text></svg>