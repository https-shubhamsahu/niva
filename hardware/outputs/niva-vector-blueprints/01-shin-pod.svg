<text x="245" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="3.05" fill="#14314B" font-weight="normal" text-anchor="start">60 x 42 x 20 P is a revised custom-PCB target, not a proven fit. The</text>
<text x="245" y="244.7" font-family="Helvetica, Arial, sans-serif" font-size="3.05" fill="#14314B" font-weight="normal" text-anchor="start">brief's 48 x 34 x 13 envelope is not carried forward. Breakout-board v0</text>
<text x="245" y="249.4" font-family="Helvetica, Arial, sans-serif" font-size="3.05" fill="#14314B" font-weight="normal" text-anchor="start">needs a separate larger enclosure after parts are measured.</text>
<text x="19" y="265" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#637887" font-weight="normal" text-anchor="start">35 P strap width / soft radiused slots / flush rear service screws / no external charging port</text>
