<text x="105" y="195" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#0B6F79" font-weight="bold" text-anchor="start">DEPTH 115 P</text>
<text x="105" y="201" font-family="Helvetica, Arial, sans-serif" font-size="2.8" fill="#637887" font-weight="normal" text-anchor="start">Insert bay: 294 P usable length.</text>
<text x="105" y="207" font-family="Helvetica, Arial, sans-serif" font-size="2.8" fill="#637887" font-weight="normal" text-anchor="start">Fit largest size before tray tooling.</text>
<text x="234" y="45" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#0B6F79" font-weight="bold" text-anchor="start">TRAY + HYGIENE</text>
<text x="234" y="51.0" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">Smooth removable polypropylene tray, open radiused recesses and no absorbent</text>
<text x="234" y="55.5" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">foam. Separate clean and used items during camp turnaround. Gasket and</text>
<text x="234" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">cleaning compatibility require tests.</text>
<text x="234" y="85" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#0B6F79" font-weight="bold" text-anchor="start">CONTENTS</text>
<text x="234" y="91.0" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">Two pods; size-matched insert pairs; two spare cartridges; dock; USB supply</text>
<text x="234" y="95.5" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">cable; power bank; replacement straps; heel keepers. Oversoles travel in a</text>
<text x="234" y="100.0" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">removable wipeable lid pouch.</text>
<text x="234" y="125" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#0B6F79" font-weight="bold" text-anchor="start">SERVICE PARTS</text>
<rect x="232" y="131" width="174" height="49" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="234" y="139" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">01 Pod assembly    02 Cradle + pad    03 Strap</text>
<text x="234" y="147" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">04 Battery cartridge    05 Insole + protected tail</text>
<text x="234" y="155" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">06 Heel keeper    07 Traction oversole</text>
<text x="234" y="163" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">08 Dock + removable case tray</text>
<text x="234" y="179" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#0B6F79" font-weight="bold" text-anchor="start">BASE KIT ONLY</text>
<text x="234" y="185.0" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">Optional knee acoustic module is not included. No disease score or medial</text>
<text x="234" y="189.5" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">contact-force claim is embodied in the hardware drawings.</text>
<rect x="12" y="227" width="396" height="44" rx="2" fill="none" stroke="#BDCBD2" stroke-width="0.25"/>
<text x="17" y="235" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#0B6F79" font-weight="bold" text-anchor="start">BUILD SEQUENCE / KEEP HIGH-RISK DECISIONS VISIBLE</text>
<text x="18" y="243" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#0B6F79" font-weight="bold" text-anchor="start">01 BENCH</text>
<text x="18" y="251" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#14314B" font-weight="normal" text-anchor="start">Sensor range, soft stack,</text>
<text x="18" y="256" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#14314B" font-weight="normal" text-anchor="start">tail noise and analog drive.</text>
<text x="117" y="243" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#0B6F79" font-weight="bold" text-anchor="start">02 FIT STUDY</text>
<text x="117" y="251" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#14314B" font-weight="normal" text-anchor="start">Print outline; measure feet;</text>
<text x="117" y="256" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#14314B" font-weight="normal" text-anchor="start">check footwear and migration.</text>
<text x="216" y="243" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#0B6F79" font-weight="bold" text-anchor="start">03 WORKING V0</text>
<text x="216" y="251" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#14314B" font-weight="normal" text-anchor="start">Measured breakout enclosure;</text>
<text x="216" y="256" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#14314B" font-weight="normal" text-anchor="start">log raw data and test faults.</text>
<text x="315" y="243" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#0B6F79" font-weight="bold" text-anchor="start">04 ENGINEERED V1</text>
<text x="315" y="251" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#14314B" font-weight="normal" text-anchor="start">Resolve H1 and component fit;</text>
<text x="315" y="256" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#14314B" font-weight="normal" text-anchor="start">then PCB, seals and tooling.</text>
</svg>