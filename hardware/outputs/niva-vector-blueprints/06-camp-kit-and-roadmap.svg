<text x="42" y="16" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#14314B" font-weight="bold" text-anchor="start">Camp kit / service and development gates</text>
<text x="12" y="25" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#637887" font-weight="normal" text-anchor="start">A washable, modular field kit. The drawings define design intent while preserving the brief's bench-first development sequence.</text>
<text x="408" y="15" font-family="Helvetica, Arial, sans-serif" font-size="4" fill="#0B6F79" font-weight="bold" text-anchor="end">ID / 06</text>
