<text x="161" y="91" font-family="Helvetica, Arial, sans-serif" font-size="2.7" fill="#14314B" font-weight="normal" text-anchor="start">Straps tucked</text>
<text x="161" y="96" font-family="Helvetica, Arial, sans-serif" font-size="2.7" fill="#14314B" font-weight="normal" text-anchor="start">in open recess</text>
<rect x="104" y="117" width="97" height="30" rx="3" fill="#EAF0F2" stroke="#0B6F79" stroke-width="0.35"/>
<rect x="109" y="123" width="14" height="17" rx="2" fill="#FFFFFF" stroke="#14314B" stroke-width="0.35"/>
