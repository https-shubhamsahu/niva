<text x="108" y="145" font-family="Helvetica, Arial, sans-serif" font-size="2.5" fill="#0B6F79" font-weight="normal" text-anchor="start">FOUR CARTRIDGES / TWO DOCK WELLS</text>
<rect x="104" y="153" width="97" height="30" rx="3" fill="#EAF0F2" stroke="#0B6F79" stroke-width="0.35"/>
