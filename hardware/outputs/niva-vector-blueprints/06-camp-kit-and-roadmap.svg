<text x="12" y="292" font-family="Helvetica, Arial, sans-serif" font-size="2.5" fill="#637887" font-weight="normal" text-anchor="start">All dimensions in mm. P = proposed target; V = verified component dimension. No general tolerances assigned.</text>
<text x="408" y="286" font-family="Helvetica, Arial, sans-serif" font-size="2.7" fill="#14314B" font-weight="normal" text-anchor="end">NV-ID-06  |  REV A  |  28 SEP 2026</text>
