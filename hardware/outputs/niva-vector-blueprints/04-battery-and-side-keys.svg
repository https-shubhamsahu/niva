<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" x="0" y="0" fill="#FFF" stroke="#FFF" stroke-width="0" rx="0"/><text x="12" y="16" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="start">NIVA</text><text x="42" y="16" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="start">Battery / charging exclusion</text><text x="12" y="25" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">Power is replenished only in a separate dock. The cartridge release is physically covered while the pod is seated.</text><text x="408" y="15" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="4" font-weight="bold" text-anchor="end">ID / 04</text><line x1="12" x2="408" y1="32" y2="32" stroke="#14314B" stroke-width=".5"/><line x1="12" x2="408" y1="280" y2="280" stroke="#14314B" stroke-width=".4"/><text x="12" y="286" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="2.7" font-weight="bold" text-anchor="start">DESIGN DEVELOPMENT / NOT FOR FABRICATION OR CLINICAL USE</text><text x="12" y="292" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="2.5" font-weight="normal" text-anchor="start">All dimensions in mm. P = proposed target; V = verified component dimension. No general tolerances assigned.</text><text x="408" y="286" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="2.7" font-weight="normal" text-anchor="end">NV-ID-04 | REV A | 28 SEP 2026</text><text x="408" y="292" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="2.5" font-weight="normal" text-anchor="end">A3 LANDSCAPE | SCALE 1:1 BATTERY / NTS MECHANISM | 04 / 06</text><text x="16" y="45" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">01 REMOVE &gt; RELEASE &gt; DOCK</text><g transform="translate(26 60) scale(0.8)"><rect width="42" height="60" x="0" y="0" fill="#EAF0F2" stroke="#14314B" stroke-width=".55" rx="8"/><rect width="38.4" height="56.4" x="1.8" y="1.8" fill="none" stroke="#BDCBD2" stroke-width=".3" rx="6.4"/><rect width="28" height="34" x="7" y="22" fill="#FFF" stroke="#0B6F79" stroke-width=".5" rx="3"/><rect width="16" height="5" x="13" y="46" fill="#EAF0F2" stroke="#0B6F79" stroke-width=".35" rx="1"/><text x="21" y="39" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="normal" text-anchor="middle">BATTERY</text><text x="21" y="43" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="2.5" font-weight="normal" text-anchor="middle">RELEASE</text><circle cx="6" cy="7" r="1.3" fill="#FFF" stroke="#14314B" stroke-width=".4"/><circle cx="36" cy="7" r="1.3" fill="#FFF" stroke="#14314B" stroke-width=".4"/><circle cx="5" cy="53" r="1.3" fill="#FFF" stroke="#14314B" stroke-width=".4"/><circle cx="37" cy="53" r="1.3" fill="#FFF" stroke="#14314B" stroke-width=".4"/><rect width="14" height="6" x="14" y="60" fill="#EAF0F2" stroke="#0B6F79" stroke-width=".4" rx="2"/></g><rect width="42" height="34" x="22" y="73" fill="none" stroke="#0B6F79" stroke-width=".8" rx="3"/><text x="43" y="122" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.2" font-weight="bold" text-anchor="middle">A SEATED</text><line x1="68" x2="88" y1="86" y2="86" stroke="#0B6F79" stroke-width=".5"/><path fill="none" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".5" d="M 86.24483487621926 86.95885107720841 L 88 86 L 86.24483487621926 85.04114892279159"/><g transform="translate(95 60) scale(0.8)"><rect width="42" height="60" x="0" y="0" fill="#EAF0F2" stroke="#14314B" stroke-width=".55" rx="8"/><rect width="38.4" height="56.4" x="1.8" y="1.8" fill="none" stroke="#BDCBD2" stroke-width=".3" rx="6.4"/><rect width="28" height="34" x="7" y="22" fill="#FFF" stroke="#0B6F79" stroke-width=".5" rx="3"/><rect width="16" height="5" x="13" y="46" fill="#EAF0F2" stroke="#0B6F79" stroke-width=".35" rx="1"/><text x="21" y="39" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="normal" text-anchor="middle">BATTERY</text><text x="21" y="43" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="2.5" font-weight="normal" text-anchor="middle">RELEASE</text><circle cx="6" cy="7" r="1.3" fill="#FFF" stroke="#14314B" stroke-width=".4"/><circle cx="36" cy="7" r="1.3" fill="#FFF" stroke="#14314B" stroke-width=".4"/><circle cx="5" cy="53" r="1.3" fill="#FFF" stroke="#14314B" stroke-width=".4"/><circle cx="37" cy="53" r="1.3" fill="#FFF" stroke="#14314B" stroke-width=".4"/><rect width="14" height="6" x="14" y="60" fill="#EAF0F2" stroke="#0B6F79" stroke-width=".4" rx="2"/></g><rect width="22.4" height="27.2" x="126" y="92" fill="#EAF0F2" stroke="#0B6F79" stroke-width=".6" rx="2"/><line x1="118" x2="128" y1="100" y2="105" stroke="#0B6F79" stroke-width=".5"/><path fill="none" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".5" d="M 126.00132135080838 105.07268876987264 L 128 105 L 126.85894382638315 103.35744381872313"/><text x="118" y="133" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.2" font-weight="bold" text-anchor="middle">B UNCLIP POD</text><line x1="153" x2="174" y1="86" y2="86" stroke="#0B6F79" stroke-width=".5"/><path fill="none" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".5" d="M 172.24483487621924 86.95885107720841 L 174 86 L 172.24483487621924 85.04114892279159"/><rect width="72" height="36" x="180" y="77" fill="#EAF0F2" stroke="#14314B" stroke-width=".6" rx="5"/><rect width="24" height="28" x="188" y="81" fill="#FFF" stroke="#0B6F79" stroke-width=".4" rx="2"/><rect width="16" height="20" x="192" y="65" fill="#EAF0F2" stroke="#0B6F79" stroke-width=".5" rx="2"/><line x1="200" x2="200" y1="69" y2="80" stroke="#0B6F79" stroke-width=".5"/><path fill="none" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".5" d="M 199.0411489227916 78.24483487621926 L 200 80 L 200.9588510772084 78.24483487621926"/><rect width="24" height="28" x="219" y="81" fill="#FFF" stroke="#0B6F79" stroke-width=".4" rx="2"/><rect width="16" height="20" x="223" y="65" fill="#EAF0F2" stroke="#0B6F79" stroke-width=".5" rx="2"/><line x1="231" x2="231" y1="69" y2="80" stroke="#0B6F79" stroke-width=".5"/><path fill="none" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".5" d="M 230.0411489227916 78.24483487621926 L 231 80 L 231.9588510772084 78.24483487621926"/><text x="216" y="133" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.2" font-weight="bold" text-anchor="middle">C CARTRIDGES ONLY</text><text x="276" y="45" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">MECHANICAL EXCLUSION</text><text x="276" y="51" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">Cradle masks the rear release. Battery cannot exit while</text><text x="276" y="55.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">seated. Pod body cannot fit the recessed charger wells.</text><text x="276" y="60" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">No charging path is provided through the sensor</text><text x="276" y="64.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">connector.</text><text x="276" y="92" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">ELECTRICAL EXCLUSION</text><text x="276" y="98" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">Protection resides in cartridge; charging resides in</text><text x="276" y="102.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">dock. Recessed contacts, polarity key and temperature</text><text x="276" y="107" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">sensing. Charger fault design still requires electrical</text><text x="276" y="111.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">review.</text><text x="16" y="151" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">02 CARTRIDGE ENVELOPE</text><rect width="28" height="34" x="28" y="173" fill="#EAF0F2" stroke="#14314B" stroke-width=".5" rx="3"/><rect width="22" height="23" x="31" y="177" fill="none" stroke="#637887" stroke-width=".3" rx="1"/><text x="42" y="186" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3" font-weight="normal" text-anchor="middle">CELL</text><text x="42" y="191" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="2.4" font-weight="normal" text-anchor="middle">ENVELOPE</text><rect width="22" height="3" x="31" y="201" fill="#FFF" stroke="#0B6F79" stroke-width=".3" rx="0"/><rect width="2" height="2" x="34" y="207" fill="#0B6F79" stroke="#0B6F79" stroke-width=".1" rx="0"/><rect width="2" height="2" x="39" y="207" fill="#0B6F79" stroke="#0B6F79" stroke-width=".1" rx="0"/><rect width="2" height="2" x="44" y="207" fill="#0B6F79" stroke="#0B6F79" stroke-width=".1" rx="0"/><rect width="2" height="2" x="49" y="207" fill="#0B6F79" stroke="#0B6F79" stroke-width=".1" rx="0"/><line x1="28" x2="28" y1="173" y2="165" stroke="#BDCBD2" stroke-width=".25"/><line x1="56" x2="56" y1="173" y2="165" stroke="#BDCBD2" stroke-width=".25"/><line x1="28" x2="56" y1="163" y2="163" stroke="#0B6F79" stroke-width=".25"/><line x1="27" x2="29" y1="164" y2="162" stroke="#0B6F79" stroke-width=".35"/><line x1="55" x2="57" y1="164" y2="162" stroke="#0B6F79" stroke-width=".35"/><text x="42" y="161" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3" font-weight="normal" text-anchor="middle">28 P</text><line x1="28" x2="20" y1="173" y2="173" stroke="#BDCBD2" stroke-width=".25"/><line x1="28" x2="20" y1="207" y2="207" stroke="#BDCBD2" stroke-width=".25"/><line x1="18" x2="18" y1="173" y2="207" stroke="#0B6F79" stroke-width=".25"/><line x1="17" x2="19" y1="174" y2="172" stroke="#0B6F79" stroke-width=".35"/><line x1="17" x2="19" y1="208" y2="206" stroke="#0B6F79" stroke-width=".35"/><text x="21" y="190" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3" font-weight="normal" text-anchor="start">34 P</text><rect width="8" height="34" x="75" y="173" fill="#EAF0F2" stroke="#14314B" stroke-width=".4" rx="2"/><line x1="75" x2="75" y1="173" y2="165" stroke="#BDCBD2" stroke-width=".25"/><line x1="83" x2="83" y1="173" y2="165" stroke="#BDCBD2" stroke-width=".25"/><line x1="75" x2="83" y1="163" y2="163" stroke="#0B6F79" stroke-width=".25"/><line x1="74" x2="76" y1="164" y2="162" stroke="#0B6F79" stroke-width=".35"/><line x1="82" x2="84" y1="164" y2="162" stroke="#0B6F79" stroke-width=".35"/><text x="79" y="161" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3" font-weight="normal" text-anchor="middle">8 P</text><text x="98" y="158" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">CONTACTS + CELL</text><text x="98" y="164" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">Four protected contacts: B+, B-, NTC, ID. Cell envelope 22 x 23</text><text x="98" y="168.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">x 5 P; capacity is unassigned until supplier selection. The</text><text x="98" y="173" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">brief&apos;s 300 mAh target is not a fit guarantee.</text><text x="98" y="204" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">SERVICE DETAIL</text><text x="98" y="210" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">Cartridge shell encloses the protected cell. No patient access</text><text x="98" y="214.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">to pouch or raw tabs. Rails, latch forces, seals and swelling</text><text x="98" y="219" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">allowance need supplier and mechanical review.</text><text x="276" y="151" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">03 LEFT / RIGHT KEY INTENT</text><rect width="40" height="21" x="284" y="166" fill="#EAF0F2" stroke="#14314B" stroke-width=".5" rx="3"/><rect width="26" height="10" x="291" y="171" fill="#FFF" stroke="#0B6F79" stroke-width=".4" rx="1"/><rect width="5" height="4" x="291" y="171" fill="#0B6F79" stroke="#0B6F79" stroke-width=".2" rx="0"/><text x="304" y="196" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="4" font-weight="bold" text-anchor="middle">L</text><rect width="40" height="21" x="346" y="166" fill="#EAF0F2" stroke="#14314B" stroke-width=".5" rx="3"/><rect width="26" height="10" x="353" y="171" fill="#FFF" stroke="#0B6F79" stroke-width=".4" rx="1"/><rect width="5" height="4" x="374" y="171" fill="#0B6F79" stroke="#0B6F79" stroke-width=".2" rx="0"/><text x="366" y="196" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="4" font-weight="bold" text-anchor="middle">R</text><text x="276" y="211" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">Different physical keys at the pod; readable L/R and</text><text x="276" y="215.6" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">tactile markers. Side/size ID resistor is in the above-</text><text x="276" y="220.2" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">collar connector assembly, paired to its insert.</text><rect width="396" height="24" x="12" y="247" fill="none" stroke="#BDCBD2" stroke-width=".25" rx="2"/><text x="17" y="255" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">RELEASE GATES</text><text x="18" y="263" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">Confirm: no charge while seated; contact shorts; temperature fault; reversed insertion; latch wear; whole left kit fitted on right leg.</text></svg>