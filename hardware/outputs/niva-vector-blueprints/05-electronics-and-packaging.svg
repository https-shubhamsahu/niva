<text x="17" y="241" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#0B6F79" font-weight="bold" text-anchor="start">ELECTRICAL REVIEW HOLDS / DO NOT COPY THE BRIEF INTO A PCB UNCHECKED</text>
<text x="18" y="247.0" font-family="Helvetica, Arial, sans-serif" font-size="3.05" fill="#14314B" font-weight="normal" text-anchor="start">Verify sensor drive circuit, ADC source settling, boot-strapping pins with button held, RF coexistence, battery sag / regulator dropout, dock thermal-fault shutdown</text>
<text x="18" y="251.8" font-family="Helvetica, Arial, sans-serif" font-size="3.05" fill="#14314B" font-weight="normal" text-anchor="start">and sync accuracy. Manufacturer A201 performance uses an op-amp circuit [S1]; divider performance must be established separately.</text>
