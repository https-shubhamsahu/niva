" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="normal" text-anchor="start">8-channel ADC / SPI</text><line x1="73" x2="90" y1="65" y2="65" stroke="#0B6F79" stroke-width=".5"/><path fill="none" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".5" d="M 88.24483487621926 65.95885107720841 L 90 65 L 88.24483487621926 64.04114892279159"/><line x1="73" x2="90" y1="100" y2="100" stroke="#0B6F79" stroke-width=".5"/><path fill="none" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".5" d="M 88.24483487621926 100.95885107720841 L 90 100 L 88.24483487621926 99.04114892279159"/><path fill="none" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".4" d="M 152 65 L 161 65 L 161 77 L 172 77"/><path fill="none" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".4" d="M 152 100 L 161 100 L 161 86 L 172 86"/><rect width="60" height="20" x="172" y="113" fill="#EAF0F2" stroke="#0B6F79" stroke-width=".4" rx="2"/><text x="175" y="120" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.3" font-weight="bold" text-anchor="start">LSM6DSO32</text><text x="175" y="126" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="normal" text-anchor="start">SPI + data-ready</text><rect width="83" height="23" x="91" y="151" fill="#EAF0F2" stroke="#0B6F79" stroke-width=".4" rx="2"/><text x="94" y="158" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.3" font-weight="bold" text-anchor="start">ESP32-C3-MINI-1</text><text x="94" y="164" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="normal" text-anchor="start">BLE / local flash / timebase</text><path fill="none" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".4" d="M 232 81 L 243 81 L 243 142 L 154 142 L 154 151"/><path fill="none" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".4" d="M 232 123 L 243 123"/><circle cx="243" cy="123" r=".7" fill="#0B6F79" stroke="#0B6F79" stroke-width=".2"/><rect width="64" height="20" x="17" y="200" fill="#EAF0F2" stroke="#0B6F79" stroke-width=".4" rx="2"/><text x="20" y="207" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.3" font-weight="bold" text-anchor="start">Battery cartridge</text><text x="20" y="213" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="normal" text-anchor="start">Protection / no charger</text><rect width="71" height="20" x="94" y="200" fill="#EAF0F2" stroke="#0B6F79" stroke-width=".4" rx="2"/><text x="97" y="207" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.3" font-weight="bold" text-anchor="start">Regulation + fuel gauge</text><text x="97" y="213" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="normal" text-anchor="start">TLV755 / MAX17048 candidates</text><line x1="81" x2="94" y1="210" y2="210" stroke="#0B6F79" stroke-width=".5"/><path fill="none" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".5" d="M 92.24483487621926 210.9588510772084 L 94 210 L 92.24483487621926 209.0411489227916"/><line x1="130" x2="130" y1="200" y2="174" stroke="#0B6F79" stroke-width=".5"/><path fill="none" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".5" d="M 130.9588510772084 175.75516512378076 L 130 174 L 129.0411489227916 175.75516512378076"/><line x1="91" x2="64" y1="162" y2="162" stroke="#0B6F79" stroke-width=".5"/><path fill="none" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".5" d="M 65.75516512378074 161.0411489227916 L 64 162 L 65.75516512378074 162.9588510772084"/><text x="18" y="160" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.2" font-weight="normal" text-anchor="start">BLE to phone</text><text x="18" y="166" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="normal" text-anchor="start">offline capture</text><line x1="174" x2="201" y1="162" y2="162" stroke="#0B6F79" stroke-width=".5"/><path fill="none" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".5" d="M 199.24483487621924 162.9588510772084 L 201 162 L 199.24483487621924 161.0411489227916"/><text x="205" y="161" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.2" font-weight="normal" text-anchor="start">Peer sync</text><text x="205" y="167" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="normal" text-anchor="start">bench verify</text><text x="261" y="44" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">02 PCB / BATTERY ZONING</text><rect width="50.4" height="70" x="282" y="61" fill="#EAF0F2" stroke="#14314B" stroke-width=".5" rx="3"/><rect width="18.48" height="23.24" x="288" y="65" fill="#FFF" stroke="#0B6F79" stroke-width=".5" rx="1"/><text x="309" y="71" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="2.7" font-weight="normal" text-anchor="start">ESP32</text><text x="309" y="76" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="2.7" font-weight="normal" text-anchor="start">module</text><rect width="46" height="16" x="284" y="62" fill="none" stroke="#946322" stroke-dasharray="2 1" stroke-width=".4" rx="1"/><text x="288" y="84" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="normal" text-anchor="start">13.2 x 16.6 V [S2]</text><rect width="15" height="11" x="288" y="92" fill="#FFF" stroke="#14314B" stroke-width=".3" rx="1"/><text x="290" y="99" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3" font-weight="normal" text-anchor="start">IMU</text><rect width="17" height="13" x="310" y="93" fill="#FFF" stroke="#14314B" stroke-width=".3" rx="1"/><text x="312" y="101" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3" font-weight="normal" text-anchor="start">ADC</text><rect width="40" height="10" x="287" y="110" fill="#FFF" stroke="#0B6F79" stroke-width=".3" rx="1"/><text x="289" y="117" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="normal" text-anchor="start">ANALOG FRONT END</text><rect width="21" height="7" x="296" y="125" fill="#FFF" stroke="#0B6F79" stroke-width=".3" rx="1"/><line x1="282" x2="282" y1="61" y2="54" stroke="#BDCBD2" stroke-width=".25"/><line x1="332.4" x2="332.4" y1="61" y2="54" stroke="#BDCBD2" stroke-width=".25"/><line x1="282" x2="332.4" y1="52" y2="52" stroke="#0B6F79" stroke-width=".25"/><line x1="281" x2="283" y1="53" y2="51" stroke="#0B6F79" stroke-width=".35"/><line x1="331.4" x2="333.4" y1="53" y2="51" stroke="#0B6F79" stroke-width=".35"/><text x="307.2" y="50" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3" font-weight="normal" text-anchor="middle">36 P PCB</text><line x1="332.4" x2="343" y1="61" y2="61" stroke="#BDCBD2" stroke-width=".25"/><line x1="332.4" x2="343" y1="131" y2="131" stroke="#BDCBD2" stroke-width=".25"/><line x1="341" x2="341" y1="61" y2="131" stroke="#0B6F79" stroke-width=".25"/><line x1="340" x2="342" y1="62" y2="60" stroke="#0B6F79" stroke-width=".35"/><line x1="340" x2="342" y1="132" y2="130" stroke="#0B6F79" stroke-width=".35"/><text x="344" y="96" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3" font-weight="normal" text-anchor="start">50 P</text><path fill="none" stroke="#637887" stroke-linecap="round" stroke-linejoin="round" stroke-width=".3" d="M 286 64 L 270 64 L 262 84"/><circle cx="286" cy="64" r=".7" fill="#0B6F79" stroke="#0B6F79" stroke-width=".1"/><text x="258" y="94" fill="#946322" font-family="Helvetica, Arial, sans-serif" font-size="2.7" font-weight="normal" text-anchor="start">RF keepout</text><text x="355" y="62" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">ZONE RULES</text><text x="355" y="68" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">Antenna at top edge.</text><text x="355" y="72.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">No cell or metal over</text><text x="355" y="77" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">antenna region. Exact</text><text x="355" y="81.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">keepout per module</text><text x="355" y="86" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">integration guide. IMU</text><text x="355" y="90.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">rigidly fixed.</text><text x="261" y="148" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">10-CONTACT STRIP / FUNCTIONAL MAP</text><text x="261" y="154" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">1 VEXC; 2-6 FORCE1-5; 7 PZ+; 8 PZ-; 9 ID; 10 GND / shield drain.</text><text x="261" y="158.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">Final sensor drive topology may change the pinout. No power-input</text><text x="261" y="163" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">function.</text><text x="261" y="188" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">ROUTING + SEAL</text><text x="261" y="194" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">14-wide sleeve P; tail length selected to fit. Shield the piezo</text><text x="261" y="198.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">pair, retain slack in cradle, and keep every rigid junction above</text><text x="261" y="203" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">collar. Bend radius awaits cable selection.</text><rect width="396" height="37" x="12" y="233" fill="none" stroke="#BDCBD2" stroke-width=".25" rx="2"/><text x="17" y="241" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">ELECTRICAL REVIEW HOLDS / DO NOT COPY THE BRIEF INTO A PCB UNCHECKED</text><text x="18" y="247" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">Verify sensor drive circuit, ADC source settling, boot-strapping pins with button held, RF coexistence, battery sag / regulator dropout, dock thermal-fault shutdown</text><text x="18" y="251.8" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">and sync accuracy. Manufacturer A201 performance uses an op-amp circuit [S1]; divider performance must be established separately.</text><text x="16" y="276" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="normal" text-anchor="start">[S2] Espressif ESP32-C3-MINI-1 datasheet v2.2: documentation.espressif.com/esp32-c3-mini-1_datasheet_en.pdf</text></svg>