<text x="261" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">1 VEXC; 2-6 FORCE1-5; 7 PZ+; 8 PZ-; 9 ID; 10 GND / shield drain.</text>
<text x="261" y="158.5" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">Final sensor drive topology may change the pinout. No power-input</text>
<text x="261" y="163.0" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">function.</text>
<text x="261" y="188" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#0B6F79" font-weight="bold" text-anchor="start">ROUTING + SEAL</text>
<text x="261" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">14-wide sleeve P; tail length selected to fit. Shield the piezo</text>
<text x="261" y="198.5" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">pair, retain slack in cradle, and keep every rigid junction above</text>
<text x="261" y="203.0" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">collar. Bend radius awaits cable selection.</text>
