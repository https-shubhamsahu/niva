<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" x="0" y="0" fill="#FFF" stroke="#FFF" stroke-width="0" rx="0"/><text x="12" y="16" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="start">NIVA</text><text x="42" y="16" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="start">Insole / soft sensing architecture</text><text x="12" y="25" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">Right medium insert shown. Left is mirrored. Sensor locations are design seeds, not measured anatomical fit.</text><text x="408" y="15" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="4" font-weight="bold" text-anchor="end">ID / 02</text><line x1="12" x2="408" y1="32" y2="32" stroke="#14314B" stroke-width=".5"/><line x1="12" x2="408" y1="280" y2="280" stroke="#14314B" stroke-width=".4"/><text x="12" y="286" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="2.7" font-weight="bold" text-anchor="start">DESIGN DEVELOPMENT / NOT FOR FABRICATION OR CLINICAL USE</text><text x="12" y="292" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="2.5" font-weight="normal" text-anchor="start">All dimensions in mm. P = proposed target; V = verified component dimension. No general tolerances assigned.</text><text x="408" y="286" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="2.7" font-weight="normal" text-anchor="end">NV-ID-02 | REV A | 28 SEP 2026</text><text x="408" y="292" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="2.5" font-weight="normal" text-anchor="end">A3 LANDSCAPE | SCALE 0.65:1 PLAN / NTS SECTION | 02 / 06</text><text x="16" y="44" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">01 SENSOR MAP</text><g transform="translate(28 64) scale(0.65)"><path fill="#EAF0F2" stroke="#14314B" stroke-linecap="round" stroke-linejoin="round" stroke-width=".65" d="M 26 0 C 10 0 2 12 1 31 C 0 54 6 84 13 111 C 21 141 15 168 17 196 C 13 225 14 252 33 259 C 52 263 70 252 72 235 C 79 215 77 190 74 172 C 76 145 86 119 94 88 C 101 64 89 42 72 26 C 55 10 42 0 26 0 Z"/><path fill="#FFF" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".6" d="M 44 5 L 39 35 Q 38 40 42 40 Q 45 40 45 35 L 50 9"/><path fill="none" stroke="#0B6F79" stroke-dasharray="3 2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M 24 25 L 14 38 L 15 75 L 25 118 L 28 180 L 30 211 Q 32 240 64 235 L 75 232"/><path fill="none" stroke="#0B6F79" stroke-dasharray="3 2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M 24 67 L 20 83 L 30 123 L 33 181 L 35 211 Q 37 232 64 230 L 75 232"/><path fill="none" stroke="#0B6F79" stroke-dasharray="3 2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M 80 80 L 83 93 L 71 137 L 66 181 L 68 218 L 75 232"/><path fill="none" stroke="#0B6F79" stroke-dasharray="3 2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M 70 143 L 61 177 L 62 214 L 75 232"/><path fill="none" stroke="#0B6F79" stroke-dasharray="3 2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M 43 228 L 60 224 L 75 232"/><circle cx="24" cy="25" r="8" fill="none" stroke="#637887" stroke-width=".3"/><circle cx="24" cy="25" r="4.765" fill="#FFF" stroke="#0B6F79" stroke-width=".7"/><text x="34" y="26" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="5" font-weight="bold" text-anchor="start">P1</text><circle cx="24" cy="67" r="8" fill="none" stroke="#637887" stroke-width=".3"/><circle cx="24" cy="67" r="4.765" fill="#FFF" stroke="#0B6F79" stroke-width=".7"/><text x="34" y="68" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="5" font-weight="bold" text-anchor="start">P2</text><circle cx="80" cy="80" r="8" fill="none" stroke="#637887" stroke-width=".3"/><circle cx="80" cy="80" r="4.765" fill="#FFF" stroke="#0B6F79" stroke-width=".7"/><line x1="85" x2="99" y1="80" y2="80" stroke="#637887" stroke-width=".45"/><text x="101" y="81" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="5" font-weight="bold" text-anchor="start">P3</text><circle cx="70" cy="143" r="8" fill="none" stroke="#637887" stroke-width=".3"/><circle cx="70" cy="143" r="4.765" fill="#FFF" stroke="#0B6F79" stroke-width=".7"/><line x1="75" x2="99" y1="143" y2="143" stroke="#637887" stroke-width=".45"/><text x="101" y="144" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="5" font-weight="bold" text-anchor="start">P4</text><circle cx="43" cy="228" r="8" fill="none" stroke="#637887" stroke-width=".3"/><circle cx="43" cy="228" r="4.765" fill="#FFF" stroke="#0B6F79" stroke-width=".7"/><path fill="none" stroke="#637887" stroke-linecap="round" stroke-linejoin="round" stroke-width=".45" d="M 48 228 L 86 213 L 99 213"/><text x="101" y="215" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="5" font-weight="bold" text-anchor="start">P5</text><rect width="16" height="8" x="47" y="240" fill="#FFF" stroke="#0B6F79" stroke-width=".6" rx="1"/><path fill="none" stroke="#637887" stroke-linecap="round" stroke-linejoin="round" stroke-width=".45" d="M 63 244 L 89 255 L 99 255"/><text x="101" y="257" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="5" font-weight="bold" text-anchor="start">V1</text><path fill="#EAF0F2" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".5" d="M 73 226 L 93 233 L 93 247 L 72 240"/><text x="43" y="198" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="middle">R / M</text></g><line x1="28" x2="28" y1="65" y2="55" stroke="#BDCBD2" stroke-width=".25"/><line x1="90.4" x2="90.4" y1="65" y2="55" stroke="#BDCBD2" stroke-width=".25"/><line x1="28" x2="90.4" y1="53" y2="53" stroke="#0B6F79" stroke-width=".25"/><line x1="27" x2="29" y1="54" y2="52" stroke="#0B6F79" stroke-width=".35"/><line x1="89.4" x2="91.4" y1="54" y2="52" stroke="#0B6F79" stroke-width=".35"/><text x="59.2" y="51" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3" font-weight="normal" text-anchor="middle">96 P envelope</text><line x1="28" x2="19" y1="64" y2="64" stroke="#BDCBD2" stroke-width=".25"/><line x1="28" x2="19" y1="233" y2="233" stroke="#BDCBD2" stroke-width=".25"/><line x1="17" x2="17" y1="64" y2="233" stroke="#0B6F79" stroke-width=".25"/><line x1="16" x2="18" y1="65" y2="63" stroke="#0B6F79" stroke-width=".35"/><line x1="16" x2="18" y1="234" y2="232" stroke="#0B6F79" stroke-width=".35"/><text x="20" y="148.5" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3" font-weight="normal" text-anchor="start">260 P</text><text x="32" y="247" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3" font-weight="normal" text-anchor="start">MEDIAL</text><text x="78" y="247" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3" font-weight="normal" text-anchor="start">LATERAL</text><text x="17" y="260" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="2.9" font-weight="normal" text-anchor="start">Dashed paths = routing intent only.</text><text x="17" y="266" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="2.9" font-weight="normal" text-anchor="start">Sensor circles shown beneath top cover.</text><text x="111" y="45" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">02 PLACEMENT / RIGHT FOOT</text><text x="111" y="51" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">Datum: heel-most point, longitudinal axis parallel to</text><text x="111" y="55.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">drawing. X measured from medial envelope edge; Y measured</text><text x="111" y="60" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">forward from heel.</text><line x1="111" x2="236" y1="79" y2="79" stroke="#BDCBD2" stroke-width=".2"/><text x="113" y="76" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="bold" text-anchor="start">POINT</text><text x="140" y="76" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">X / Y P</text><text x="176" y="76" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">FUNCTION</text><line x1="111" x2="236" y1="88" y2="88" stroke="#BDCBD2" stroke-width=".2"/><text x="113" y="85" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">P1</text><text x="140" y="85" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">24 / 235</text><text x="176" y="85" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">Big toe</text><line x1="111" x2="236" y1="97" y2="97" stroke="#BDCBD2" stroke-width=".2"/><text x="113" y="94" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">P2</text><text x="140" y="94" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">24 / 193</text><text x="176" y="94" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">Medial forefoot</text><line x1="111" x2="236" y1="106" y2="106" stroke="#BDCBD2" stroke-width=".2"/><text x="113" y="103" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">P3</text><text x="140" y="103" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">80 / 180</text><text x="176" y="103" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">Lateral forefoot</text><line x1="111" x2="236" y1="115" y2="115" stroke="#BDCBD2" stroke-width=".2"/><text x="113" y="112" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">P4</text><text x="140" y="112" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">70 / 117</text><text x="176" y="112" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">Lateral midfoot</text><line x1="111" x2="236" y1="124" y2="124" stroke="#BDCBD2" stroke-width=".2"/><text x="113" y="121" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">P5</text><text x="140" y="121" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">43 / 32</text><text x="176" y="121" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">Heel force</text><text x="111" y="140" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">SENSOR GEOMETRY</text><text x="111" y="146" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">A201 active diameter 9.53 V; thickness 0.203 V [S1].</text><text x="111" y="150.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">Outer footprint, tails and recesses need supplier CAD. Do</text><text x="111" y="155" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">not substitute the active circle for a cutting outline.</text><text x="111" y="176" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">TOE-POST ZONE</text><text x="111" y="182" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">Soft slot 6 x 28 P; rounded termination. Keep traces</text><text x="111" y="186.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">outside a provisional 5-wide border. Validate toe-web fit</text><text x="111" y="191" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">across sizes. No field trimming in this revision.</text><rect width="134" height="54" x="108" y="215" fill="none" stroke="#BDCBD2" stroke-width=".25" rx="2"/><text x="113" y="223" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">HOLD H1 / STOCK TAIL REACH</text><text x="113" y="230" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">The toe-to-heel route exceeds the standard A201 length</text><text x="113" y="234.7" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">(~190.5 overall). Stock tails cannot simply reach a</text><text x="113" y="239.4" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">common heel junction. Use bench sensors first; wearable</text><text x="113" y="244.1" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">routing requires supplier-approved long-tail/custom flex</text><text x="113" y="248.8" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.05" font-weight="normal" text-anchor="start">parts. No hard extension joints underfoot.</text><text x="259" y="44" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">03 MATERIAL SECTION / SOFT STACK</text><rect width="141" height="5" x="260" y="64" fill="#EAF0F2" stroke="#14314B" stroke-width=".3" rx="0"/><text x="263" y="67.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="2.9" font-weight="normal" text-anchor="start">0.4 P / Sealed TPU-faced cover</text><rect width="141" height="12" x="260" y="69" fill="#D4E8E8" stroke="#14314B" stroke-width=".3" rx="0"/><text x="263" y="76" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="2.9" font-weight="normal" text-anchor="start">1.0 P / Continuous comfort foam</text><rect width="141" height="3" x="260" y="81" fill="#0B6F79" stroke="#14314B" stroke-width=".3" rx="0"/><text x="263" y="83.5" fill="#FFF" font-family="Helvetica, Arial, sans-serif" font-size="2.9" font-weight="normal" text-anchor="start">0.203 V / Sensor; recessed routing</text><rect width="141" height="12" x="260" y="84" fill="#EAF0F2" stroke="#14314B" stroke-width=".3" rx="0"/><text x="263" y="91" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="2.9" font-weight="normal" text-anchor="start">1.0 P / Pocketed EVA / TPU base</text><path fill="none" stroke="#0B6F79" stroke-linecap="round" stroke-linejoin="round" stroke-width=".8" d="M 260 65 L 257 65 L 257 96 L 260 96"/><text x="260" y="109" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="bold" text-anchor="start">Nominal ~2.6 + adhesive; target ~2.8 P.</text><text x="260" y="119" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">V1: PVDF occupies a separate recessed heel zone beside P5. Its</text><text x="260" y="123.6" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">film, leads and cover must not create a thicker local stack.</text><text x="260" y="144" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">NO HARD SPOTS</text><text x="260" y="150" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">No pucks, pins, crimps, solder or boards in the plantar</text><text x="260" y="154.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">envelope. Use flexible film and continuous cushioning.</text><text x="260" y="159" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">Calibration must include the complete assembled stack.</text><text x="260" y="183" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">SEAL + REPAIR</text><text x="260" y="189" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">3 P perimeter seal allowance; process trials required. Replace</text><text x="260" y="193.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">the sealed insert and tail as one unit. Electronics, ID</text><text x="260" y="198" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">resistor and rigid junctions stay above the shoe collar.</text><text x="260" y="225" fill="#0B6F79" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" text-anchor="start">BEFORE WEAR</text><text x="260" y="231" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">Check full tail geometry, sensor overlap, seal peel, bending,</text><text x="260" y="235.5" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">sweat ingress, thickness and local pressure under repeated</text><text x="260" y="240" fill="#14314B" font-family="Helvetica, Arial, sans-serif" font-size="3.1" font-weight="normal" text-anchor="start">loading. The supplied 1:1 outline is a fit-study template only.</text><text x="111" y="275" fill="#637887" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="normal" text-anchor="start">[S1] Tekscan A201: tekscan.com/products-solutions/force-sensors/a201 (checked 28 Sep 2026)</text></svg>