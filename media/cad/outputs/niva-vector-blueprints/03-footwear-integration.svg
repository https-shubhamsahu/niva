<text x="18" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="3.15" fill="#14314B" font-weight="normal" text-anchor="start">Toe-post slot clears the thong. Soft heel keeper</text>
<text x="18" y="194.8" font-family="Helvetica, Arial, sans-serif" font-size="3.15" fill="#14314B" font-weight="normal" text-anchor="start">locates the insert on the existing footbed. Validate</text>
<text x="18" y="199.6" font-family="Helvetica, Arial, sans-serif" font-size="3.15" fill="#14314B" font-weight="normal" text-anchor="start">migration.</text>
<rect x="146" y="40" width="128" height="181" rx="2" fill="none" stroke="#BDCBD2" stroke-width="0.25"/>
<text x="151" y="48" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#0B6F79" font-weight="bold" text-anchor="start">SANDAL</text>
