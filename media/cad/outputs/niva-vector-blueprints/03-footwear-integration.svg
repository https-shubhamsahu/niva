<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<rect x="0" y="0" width="420" height="297" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="12" y="16" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#14314B" font-weight="bold" text-anchor="start">NIVA</text>
<text x="42" y="16" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#14314B" font-weight="bold" text-anchor="start">Footwear / one sensing platform</text>
<text x="12" y="25" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#637887" font-weight="normal" text-anchor="start">No rigid component sits in the shoe or beneath the foot. Retention changes; pod and sensing architecture remain common.</text>
<text x="408" y="15" font-family="Helvetica, Arial, sans-serif" font-size="4" fill="#0B6F79" font-weight="bold" text-anchor="end">ID / 03</text>
<line x1="12" y1="32" x2="408" y2="32" stroke="#14314B" stroke-width="0.5"/>
<line x1="12" y1="280" x2="408" y2="280" stroke="#14314B" stroke-width="0.4"/>
<text x="12" y="286" font-family="Helvetica, Arial, sans-serif" font-size="2.7" fill="#0B6F79" font-weight="bold" text-anchor="start">DESIGN DEVELOPMENT  /  NOT FOR FABRICATION OR CLINICAL USE</text>
<text x="12" y="292" font-family="Helvetica, Arial, sans-serif" font-size="2.5" fill="#637887" font-weight="normal" text-anchor="start">All dimensions in mm. P = proposed target; V = verified component dimension. No general tolerances assigned.</text>
<text x="408" y="286" font-family="Helvetica, Arial, sans-serif" font-size="2.7" fill="#14314B" font-weight="normal" text-anchor="end">NV-ID-03  |  REV A  |  28 SEP 2026</text>
<text x="408" y="292" font-family="Helvetica, Arial, sans-serif" font-size="2.5" fill="#637887" font-weight="normal" text-anchor="end">A3 LANDSCAPE  |  SCALE DIAGRAMMATIC  |  03 / 06</text>
