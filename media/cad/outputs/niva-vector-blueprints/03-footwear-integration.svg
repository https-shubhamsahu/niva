<text x="286" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="3.15" fill="#14314B" font-weight="normal" text-anchor="start">Replace removable sockliner when possible. Sleeve</text>
<text x="286" y="194.8" font-family="Helvetica, Arial, sans-serif" font-size="3.15" fill="#14314B" font-weight="normal" text-anchor="start">protects the collar exit. Confirm volume and heel</text>
<text x="286" y="199.6" font-family="Helvetica, Arial, sans-serif" font-size="3.15" fill="#14314B" font-weight="normal" text-anchor="start">clearance.</text>
<rect x="12" y="228" width="128" height="42" rx="2" fill="none" stroke="#BDCBD2" stroke-width="0.25"/>
<text x="17" y="236" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#0B6F79" font-weight="bold" text-anchor="start">GUMBOOTS + BAREFOOT</text>
<text x="18" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">Use the supplied traction oversole if a boot shaft</text>
<text x="18" y="246.7" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">covers the pod or the shoe is too tight. Record the</text>
<text x="18" y="251.4" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">actual test footwear.</text>
<rect x="146" y="228" width="128" height="42" rx="2" fill="none" stroke="#BDCBD2" stroke-width="0.25"/>
<text x="151" y="236" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#0B6F79" font-weight="bold" text-anchor="start">MOUNTING RULE</text>
<text x="152" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">Cradle on anterolateral lower shin, clear of ankle</text>
<text x="152" y="246.7" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">bones. No fixed height fits everyone; confirm</text>
<text x="152" y="251.4" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">orientation and movement.</text>
<rect x="280" y="228" width="128" height="42" rx="2" fill="none" stroke="#BDCBD2" stroke-width="0.25"/>
<text x="285" y="236" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#0B6F79" font-weight="bold" text-anchor="start">FIT CHECK</text>
<text x="286" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">Seat insert; fasten pod; retain tail; verify</text>
<text x="286" y="246.7" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">anatomical side; check collar pressure; calibrate.</text>
<text x="286" y="251.4" font-family="Helvetica, Arial, sans-serif" font-size="3.1" fill="#14314B" font-weight="normal" text-anchor="start">Target &lt;60 s, not yet proven.</text>
</svg>