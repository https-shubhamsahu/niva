<text x="152" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="3.15" fill="#14314B" font-weight="normal" text-anchor="start">Use existing straps. Route the soft tail clear of</text>
<text x="152" y="194.8" font-family="Helvetica, Arial, sans-serif" font-size="3.15" fill="#14314B" font-weight="normal" text-anchor="start">buckle and heel-strap pressure. Add keeper only if</text>
<text x="152" y="199.6" font-family="Helvetica, Arial, sans-serif" font-size="3.15" fill="#14314B" font-weight="normal" text-anchor="start">needed.</text>
<rect x="280" y="40" width="128" height="181" rx="2" fill="none" stroke="#BDCBD2" stroke-width="0.25"/>
<text x="285" y="48" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#0B6F79" font-weight="bold" text-anchor="start">SHOE</text>
