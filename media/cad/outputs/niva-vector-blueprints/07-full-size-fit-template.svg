<text x="302" y="56.3" font-family="Helvetica, Arial, sans-serif" font-size="3.3" fill="#14314B" font-weight="normal" text-anchor="start">heads, toe-web position and soft tissue</text>
<text x="302" y="61.6" font-family="Helvetica, Arial, sans-serif" font-size="3.3" fill="#14314B" font-weight="normal" text-anchor="start">clearance on measured users. This is not an</text>
<text x="302" y="66.9" font-family="Helvetica, Arial, sans-serif" font-size="3.3" fill="#14314B" font-weight="normal" text-anchor="start">approved size standard.</text>
