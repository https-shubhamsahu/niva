<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
<title id="t">niva: ESP32 smart insole with explainable gait analytics</title>
<desc id="d">A right insole outline from the 1:1 fit template with four pressure pads: heel, inner, outer and toe. Pressure moves from heel to toe through one gait cycle while the matching phase rule lights up: HEEL_STRIKE when heel is above 80 and toe below 40, MID_STANCE when heel, inner and outer are all above 50, TOE_OFF when toe is above 80 and heel below 30, SWING when the total load is below 20.</desc>
<style>
@keyframes ring{0%{transform:scale(.4);opacity:.9}6%{transform:scale(1.7);opacity:0}100%{transform:scale(1.7);opacity:0}}
@keyframes p0{0%,23%{opacity:1}26%,96%{opacity:0}100%{opacity:1}}
@keyframes p1{0%,24%{opacity:0}27%,48%{opacity:1}51%,100%{opacity:0}}
@keyframes p2{0%,49%{opacity:0}52%,73%{opacity:1}76%,100%{opacity:0}}
@keyframes p3{0%,74%{opacity:0}77%,96%{opacity:1}99%,100%{opacity:0}}
@keyframes b_heel{0%,23%{transform:scale(0.903)}27%,48%{transform:scale(0.708)}52%,73%{transform:scale(0.388)}77%,96%{transform:scale(0.318)}100%{transform:scale(0.903)}}
@keyframes b_inner{0%,23%{transform:scale(0.430)}27%,48%{transform:scale(0.736)}52%,73%{transform:scale(0.583)}77%,96%{transform:scale(0.311)}100%{transform:scale(0.430)}}
@keyframes b_outer{0%,23%{transform:scale(0.402)}27%,48%{transform:scale(0.687)}52%,73%{transform:scale(0.513)}77%,96%{transform:scale(0.311)}100%{transform:scale(0.402)}}
@keyframes b_toe{0%,23%{transform:scale(0.346)}27%,48%{transform:scale(0.513)}52%,73%{transform:scale(0.917)}77%,96%{transform:scale(0.311)}100%{transform:scale(0.346)}}
@keyframes cop{0%,23%{transform:translateX(132.3px)}27%,48%{transform:translateX(242.4px)}52%,73%{transform:translateX(324.7px)}77%,96%{transform:translateX(324.7px)}100%{transform:translateX(132.3px)}}
@keyframes copfade{0%,73%{opacity:1}76%,96%{opacity:0}100%{opacity:1}}
.b_heel{transform-box:fill-box;transform-origin:center;transform:scale(0.708);animation:b_heel 6s infinite}
.b_inner{transform-box:fill-box;transform-origin:center;transform:scale(0.736);animation:b_inner 6s infinite}
.b_outer{transform-box:fill-box;transform-origin:center;transform:scale(0.687);animation:b_outer 6s infinite}
.b_toe{transform-box:fill-box;transform-origin:center;transform:scale(0.513);animation:b_toe 6s infinite}
.p0{opacity:0;animation:p0 6s infinite}
.p1{opacity:1;animation:p1 6s infinite}
.p2{opacity:0;animation:p2 6s infinite}
.p3{opacity:0;animation:p3 6s infinite}
.cop{transform:translateX(242.4px);animation:cop 6s infinite,copfade 6s infinite}
.ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 6s infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
