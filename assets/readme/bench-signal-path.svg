<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
<title id="t">Niva bench build: sensor pins to apps</title>
<desc id="d">Four FSRs on GPIO 32 to 35 and a piezo heel disc on GPIO 36 feed the ESP32 ADC. An MPU6050 at 0x68 and an SH1106 OLED at 0x3C share I2C on SDA 21 and SCL 22. The niva_hardware sketch oversamples each channel 16 times, subtracts a zero-load tare saved in NVS, and sends one frame every 50 ms as JSON over WebSocket port 81 and as CSV over USB Serial at 115200 baud. niva web and niva flutter run the same biomechanics engine.</desc>
