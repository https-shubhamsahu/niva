<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="716" viewBox="0 0 1200 716" role="img" aria-labelledby="t d">
<title id="t">Niva Rev C.1 pod: insole flex to ESP32-C3</title>
<desc id="d">Five printed force regions and a PVDF heel film on the insole flex reach the pod through a 10-pin JST GH tail. Each force region has a 10 kilo-ohm 0.1 percent load resistor and a 3.3 kilo-ohm, 1 microfarad filter into MCP3208 channels 0 to 4. The PVDF film is biased, clamped by a BAV199 and buffered by an MCP6001 into channel 5. Channel 6 reads 3V3 over 2 as a tail-fault monitor and channel 7 reads the insert ID resistor. VEXC is both sensor excitation and ADC reference, so readings are ratiometric. The MCP3208 and an LSM6DSO32 IMU share SPI with an ESP32-C3-MINI-1; a MAX17048 gauge sits on I2C; a TLV75533 regulates the cartridge cell to 3.3 V.</desc>
<rect x="1" y="1" width="1198" height="714" rx="24" fill="#f3f5f1" stroke="#d6ddd8" stroke-width="2"/>
