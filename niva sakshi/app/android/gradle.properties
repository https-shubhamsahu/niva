org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError
# Low-memory build: one worker, Kotlin compiled inside the Gradle daemon
# instead of a second JVM. The team laptop has 16 GB and is usually busy.
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
