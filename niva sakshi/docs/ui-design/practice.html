<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../../app/assets/fonts/Inter-Variable.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;position:relative;background:#F2F2F7;font-family:Inter,sans-serif;color:#1C1C1E;-webkit-font-smoothing:antialiased}
.sb{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 32px;font:600 16px/1 Inter}
.sb .r{display:flex;gap:6px;align-items:center}
.bat{width:26px;height:12px;border:1.6px solid #1C1C1E;border-radius:4px;padding:1.5px;position:relative}
.bat i{display:block;height:100%;width:78%;background:#1C1C1E;border-radius:2px}
.nav{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.back{display:flex;align-items:center;gap:2px;color:#0066CC;font:400 17px/1 Inter}
.nav .t{font:600 17px/1 Inter}
.nav .rt{color:#0066CC;font:400 17px/1 Inter}
.lt{padding:4px 18px 0}
.lt h1{font:700 32px/1.1 Inter;letter-spacing:-.4px}
.lt p{font:400 15px/1.3 Inter;color:#6C6C70;margin-top:4px}
.card{background:#fff;border-radius:18px;margin:12px 16px 0;padding:16px}
.sec{font:600 13px/1 Inter;color:#6C6C70;text-transform:uppercase;margin:20px 32px 0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font:600 13px/1 Inter}
.btn{height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:8px;font:600 17px/1 Inter}
.btn.p{background:#0066CC;color:#fff}
.btn.o{background:#fff;color:#0066CC;border:1.5px solid #C7D7EC}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:#1C1C1E;transform:translateX(-50%)}
</style></head><body>
